# Library lints: flutter_lints plus stricter type checks and documented public
# API. `public_member_api_docs` applies to lib/ only (every exported member has
# dartdoc); tests are not a public API.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    # The catalog is its own Flutter app with its own analysis options.
    - widgetbook/**

linter:
  rules:
    public_member_api_docs: true
    always_declare_return_types: true
    avoid_dynamic_calls: true
    prefer_final_fields: true
    prefer_const_constructors: true
    sort_child_properties_last: true
    unawaited_futures: true
